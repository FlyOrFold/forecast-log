name: sync-sites

# Regenerates sites.yaml (and fills blank timezones in sites.csv) whenever
# sites.csv changes on main, then commits the result.
on:
  push:
    branches: [main]
    paths: [sites.csv]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write # shared with fetch-forecasts so their pushes never race
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate sites.yaml
        run: python -m forecast_log.sites

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Commit if changed
        run: |
          git add sites.yaml sites.csv
          if git diff --cached --quiet; then
            echo "sites.yaml already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "sites: regenerate sites.yaml from sites.csv"
          git pull --rebase
          git push
