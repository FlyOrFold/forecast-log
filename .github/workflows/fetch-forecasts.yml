name: fetch-forecasts

on:
  schedule:
    # 10:17 UTC (06:17 EDT / 05:17 EST): after the 00Z ensemble runs have published.
    # Off the :00/:30 marks, where GitHub schedule delays are worst.
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and print only; do not commit"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repo-write # shared with sync-sites so their pushes never race
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Fetch forecasts
        run: python -m forecast_log ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit data if changed
        if: ${{ !inputs.dry_run }}
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: forecasts for $(date -u +%F)"
          git pull --rebase
          git push
